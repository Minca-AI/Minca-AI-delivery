# Task entrypoints for a Python project managed by uv (design section 5.1).
#
# Include it FLATTENED from the repository's Taskfile.yml so the targets keep their
# contract names (lint, test, ...). To override one target, add it to `excludes:`
# and define it in your own Taskfile; to tune one, pass `vars:` on the include.
# See README.md, "Taskfile fragments".
#
# Rules every target follows: exit non-zero on failure, never modify tracked
# files, and run the same locally and in CI.
version: '3'

vars:
  # Extra arguments, overridable per repository through the include's `vars:`.
  PYTEST_ARGS: '{{.PYTEST_ARGS | default "-q"}}'
  PYTEST_MARKERS: '{{.PYTEST_MARKERS | default "not live and not integration"}}'
  INTEGRATION_MARKERS: '{{.INTEGRATION_MARKERS | default "integration"}}'
  MYPY_ARGS: '{{.MYPY_ARGS | default ""}}'
  SMOKE_ARGS: '{{.SMOKE_ARGS | default "--help"}}'

tasks:
  setup:
    desc: Install the locked dependencies (fails if uv.lock is out of date)
    cmds:
      - uv sync --all-groups --frozen

  lint:
    desc: Style checks, read-only
    cmds:
      - uv run --frozen ruff check .
      - uv run --frozen ruff format --check .

  typecheck:
    desc: Type checking (configure `files` under [tool.mypy])
    cmds:
      - uv run --frozen mypy {{.MYPY_ARGS}}

  arch:
    desc: Import-linter contracts; skipped when the repository declares none
    cmds:
      - |
        if [ -f .importlinter ] || grep -qs '^\[tool\.importlinter\]' pyproject.toml; then
          uv run --frozen lint-imports
        else
          echo "arch: skipped (no import-linter contract declared)"
        fi

  test:
    desc: Unit lane, no network and no Docker
    cmds:
      - uv run --frozen pytest {{.PYTEST_ARGS}} -m "{{.PYTEST_MARKERS}}"

  test:integration:
    desc: Integration lane (needs Docker; CI routes it to the large pool)
    cmds:
      - uv run --frozen pytest {{.PYTEST_ARGS}} -m "{{.INTEGRATION_MARKERS}}"

  image:smoke:
    desc: Prove the built image starts. IMAGE is the loaded image reference
    requires:
      vars: [IMAGE]
    cmds:
      - docker run --rm "{{.IMAGE}}" {{.SMOKE_ARGS}}
