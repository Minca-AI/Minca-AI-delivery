apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "minca-service.name" . }}
  labels:
    {{- include "minca-service.labels" . | nindent 4 }}
  annotations:
    # Identity and secrets exist before anything that runs under them (the
    # migration Job at wave -1, the Deployment at wave 0).
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .Values.serviceAccount.roleArn }}
    # IRSA: pods of this service, and only them, assume this role.
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
automountServiceAccountToken: false
