{{- /*
The service's environment as two objects, both injected with envFrom:

- ConfigMap <name>-env from `env` (plain configuration).
- Secret <name>-env from `secretEnv` (values the deploy repository keeps
  SOPS-encrypted and decrypts at render time, e.g. an ArgoCD SOPS plugin).

An empty map renders no object and no envFrom entry. Wave -2 with the
ServiceAccount: both exist before the migration Job (wave -1) and the
Deployment (wave 0) that read them. The pod template carries a checksum of each,
so changing a value rolls the pods.

`data` (base64) and not `stringData`: the object in git and the live object
compare equal, so ArgoCD never reports a permanent diff.
*/ -}}
{{- with .Values.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minca-service.envObjectName" $ }}
  labels:
    {{- include "minca-service.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
{{- with .Values.secretEnv }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minca-service.envObjectName" $ }}
  labels:
    {{- include "minca-service.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
data:
  {{- range $k, $v := . }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
