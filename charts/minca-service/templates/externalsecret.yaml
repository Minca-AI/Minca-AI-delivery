{{- /*
One ExternalSecret per secrets[] entry (design 5.6). One object per value keeps a
missing key visible on exactly one resource (SecretSyncedError names it) instead
of blocking every secret of the service.

Wave -2 with the ServiceAccount: ArgoCD waits for the ExternalSecret to be Ready
before wave -1 (migration) and wave 0 (Deployment), so neither starts against a
Secret that does not exist yet. This is also why the migration is a Sync-wave
hook and not a PreSync hook: PreSync runs before any of these exist.
*/ -}}
{{- $root := . -}}
{{- range .Values.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "minca-service.secretName" (dict "root" $root "entry" .) }}
  labels:
    {{- include "minca-service.labels" $root | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $root.Values.secretStore.refreshInterval }}
  secretStoreRef:
    kind: {{ $root.Values.secretStore.kind }}
    name: {{ $root.Values.secretStore.name }}
  target:
    name: {{ include "minca-service.secretName" (dict "root" $root "entry" .) }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ .from }}
        property: {{ .key }}
{{- end }}
