suite: externalsecret
templates:
  - externalsecret.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: renders nothing without secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one ExternalSecret per secret entry
    set:
      secrets:
        - name: DATABASE_URL
          from: example/dev/svc
          key: database_url
        - name: API_KEY
          from: example/dev/llm
          key: api_key
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: minimal-api-key
        documentIndex: 1
      - equal:
          path: spec.data[0]
          value:
            secretKey: API_KEY
            remoteRef:
              key: example/dev/llm
              property: api_key
        documentIndex: 1
      - equal:
          path: spec.secretStoreRef
          value:
            kind: ClusterSecretStore
            name: aws-secrets-manager
        documentIndex: 0

  - it: syncs before the migration and the Deployment
    set:
      secrets:
        - name: DATABASE_URL
          from: example/dev/svc
          key: database_url
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-2"
