suite: serviceaccount
templates:
  - serviceaccount.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: annotates the IRSA role when one is given
    set:
      serviceAccount.roleArn: arn:aws:iam::111111111111:role/example-dev-svc
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::111111111111:role/example-dev-svc

  - it: has no AWS identity by default
    asserts:
      - notExists:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]

  - it: rejects a malformed role ARN through the schema
    set:
      serviceAccount.roleArn: not-an-arn
    asserts:
      - failedTemplate: {}
