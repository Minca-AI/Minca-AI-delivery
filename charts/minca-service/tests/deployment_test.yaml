suite: deployment
templates:
  - deployment.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: renders the image by digest, never by tag
    set:
      image.registry: 111111111111.dkr.ecr.us-east-1.amazonaws.com
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: 111111111111.dkr.ecr.us-east-1.amazonaws.com/minca/example-service@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: refuses to render without a digest
    set:
      image.digest: ""
    asserts:
      - failedTemplate:
          errorMessage: "values.image.digest is required (sha256:...)"

  - it: never reduces capacity during a rollout
    asserts:
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 1

  - it: runs as non-root with a read-only root filesystem by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: mounts a bounded emptyDir at /tmp so the read-only root still works
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir:
              sizeLimit: 256Mi

  - it: lets a service opt out of the hardening explicitly
    set:
      security.readOnlyRootFilesystem: false
      security.runAsNonRoot: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: false

  - it: probes readiness, liveness and startup over HTTP
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 30

  - it: renders no probes for a worker
    set:
      ports: []
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: injects env from the ConfigMap, then secretEnv from the Secret
    set:
      env:
        LOG_LEVEL: info
      secretEnv:
        DATABASE_URL: postgresql://example
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: minimal-env
            - secretRef:
                name: minimal-env
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: never applies migration.env to the service
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
      migration.env:
        DB_USER: service_migrator
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: has no envFrom when env and secretEnv are empty
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].envFrom

  - it: stamps the checksum of an empty secretEnv by default
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret-env"]
          value: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a

  - it: rolls the pods when a secretEnv value changes
    set:
      secretEnv:
        DATABASE_URL: postgresql://new
    asserts:
      - notEqual:
          path: spec.template.metadata.annotations["checksum/secret-env"]
          value: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a  # sha256 of an empty map
      - exists:
          path: spec.template.metadata.annotations["checksum/env"]

  - it: keeps one secretKeyRef per optional ExternalSecret entry
    set:
      secrets:
        - name: DATABASE_URL
          from: example/dev/svc
          key: database_url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: minimal-database-url
                key: DATABASE_URL

  - it: omits replicas when the HPA owns them
    set:
      autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.replicas

  - it: mounts no persistent volume by default
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: persistence
          any: true
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: mounts the existing claim at the mount path when persistence is enabled
    set:
      persistence.enabled: true
      persistence.existingClaim: example-cases
      persistence.mountPath: /data/cases
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: persistence
            persistentVolumeClaim:
              claimName: example-cases
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: persistence
            mountPath: /data/cases
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp

  - it: passes subPath through when set
    set:
      persistence.enabled: true
      persistence.existingClaim: example-cases
      persistence.mountPath: /data/cases
      persistence.subPath: cases
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: persistence
            mountPath: /data/cases
            subPath: cases

  - it: refuses persistence without a claim
    set:
      persistence.enabled: true
      persistence.mountPath: /data/cases
    asserts:
      - failedTemplate:
          errorMessage: "values.persistence.existingClaim is required when persistence.enabled"

  - it: refuses persistence without a mount path
    set:
      persistence.enabled: true
      persistence.existingClaim: example-cases
    asserts:
      - failedTemplate:
          errorMessage: "values.persistence.mountPath is required when persistence.enabled"
