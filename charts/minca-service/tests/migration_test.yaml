suite: migration job
templates:
  - migration-job.yaml
values:
  - ../ci/minimal-values.yaml
tests:
  - it: is disabled by default
    asserts:
      - hasDocuments:
          count: 0

  - it: fails the sync on the first failure
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 0
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never

  - it: gates the Deployment as an ArgoCD hook that keeps a failed Job for inspection
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation

  - it: runs the same image by digest and the same hardening as the service
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: minca/example-service@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["svc", "migrate"]
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: reads the same env and secretEnv as the service
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
      env:
        LOG_LEVEL: info
      secretEnv:
        DATABASE_URL: postgresql://example
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: minimal-env
            - secretRef:
                name: minimal-env

  - it: refuses to enable a migration without a command
    set:
      migration.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: migration.enabled is true but migration.command is empty

  - it: never mounts the persistence claim into the migration Job
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
      persistence.enabled: true
      persistence.existingClaim: example-cases
      persistence.mountPath: /data/cases
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: overrides env for the Job only with migration.env
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
      env:
        DB_USER: service_app
      migration.env:
        DB_USER: service_migrator
        MIGRATION_TIMEOUT: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: DB_USER
              value: service_migrator
            - name: MIGRATION_TIMEOUT
              value: "60"
      - equal:
          path: spec.template.spec.containers[0].envFrom
          value:
            - configMapRef:
                name: minimal-env

  - it: renders no env list without migration.env or secrets
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env

  - it: never mounts host paths in the Job, but keeps the node placement
    set:
      migration.enabled: true
      migration.command: ["svc", "migrate"]
      nodeSelector:
        dedicated: example
      hostPathMounts:
        - name: model
          hostPath: /opt/minca/models/example/v1
          mountPath: /models/example
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: hostpath-model
          any: true
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            dedicated: example
